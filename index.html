<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elsevier roundtable: The reality of AI in the lab — 9 September 2026</title>
<meta name="description" content="Keywords submitted by participants ahead of the Elsevier roundtable “The reality of AI in the lab”, 9 September 2026." />

<!-- Theme is resolved before the first paint, so a returning dark-mode
     visitor never sees a white flash. Light is the default and the system
     preference is deliberately not consulted: this page is shown on a
     projector and in a room, where the light plate is the one that reads.
     Dark is opt-in, and only sticks once someone has asked for it. -->
<script>
  (function () {
    var t = 'light';
    try {
      if (localStorage.getItem('roundtable.theme.v1') === 'dark') t = 'dark';
    } catch (e) { /* private mode — stay light */ }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<!-- The tab icon is the same crop of the flyer's shard graphic as the
     brand chip in the top bar. Without it the browser asks for
     /favicon.ico and gets a 404 on every visit. -->
<link rel="icon" type="image/png" href="assets/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Source Serif 4 stands in for Tiempos Text, the serif on the printed
     invitation; IBM Plex Sans stands in for National 2. Neither Elsevier
     face is licensed for the open web, and these are the closest free
     matches in structure and weight. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ══ TOP BAR ═══════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="topbar-in">

    <!-- Title lockup. One line, two faces: the host reads as the label in
         sans, the subject as the headline in the invitation's serif. The
         colon is the hinge between them. The chip is a crop of the orange
         shard graphic from the invitation, standing in for a logo lockup. -->
    <p class="mark">
      <span class="mark-chip" aria-hidden="true"></span>
      <span class="mark-name">Elsevier roundtable<span class="mark-colon" aria-hidden="true">:</span></span>
      <!-- The invitation sets "The reality of AI" roman and "in the lab"
           italic, in Tiempos Text. Same split here, same serif role. -->
      <span class="mark-topic">The reality of AI <em>in the lab</em></span>
      <span class="mark-dot" aria-hidden="true"></span>
      <span class="mark-date">9 September 2026</span>
    </p>

    <div class="topbar-tools">
      <div class="switch" role="tablist" aria-label="How terms are grouped">
        <button class="switch-opt is-on" role="tab" aria-selected="true"  data-view="phrases">Phrases</button>
        <button class="switch-opt"       role="tab" aria-selected="false" data-view="words">Single words</button>
      </div>

      <!-- Dark mode. Both icons sit in the DOM and CSS reveals the one that
           applies, so the swap costs nothing at runtime. -->
      <button class="theme-btn" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode" title="Dark mode">
        <span class="theme-icon theme-icon-sun" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.13 1.13M11.67 11.67l1.13 1.13M12.8 3.2l-1.13 1.13M4.33 11.67L3.2 12.8"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="theme-icon theme-icon-moon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M13.4 9.9A5.9 5.9 0 016.1 2.6a5.9 5.9 0 107.3 7.3z"
                  stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <button class="icon-btn" id="drawer-open" aria-expanded="false" aria-controls="drawer">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <path d="M2 4h11M2 7.5h11M2 11h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Build
      </button>
    </div>

  </div>
</header>

<!-- ══ THE PLATE — the hero ══════════════════════════════════════ -->
<main class="stage">

  <figure class="plate-wrap">

    <!-- ── When / Where / Who ────────────────────────────────────
         The invitation's three facts, in the invitation's own order, on
         the invitation's own cards, headed by the three icons lifted
         straight out of it. It sits above the plate because that is where
         the flyer puts it, and because anyone arriving on the link needs
         to know what the cloud is for before they read it. It is outside
         the element that goes full screen, so the projected cloud is
         never carrying it. -->
    <ul class="facts">
      <li class="fact">
        <span class="fact-icon"><img src="assets/icon-when.png" width="26" height="26" alt="" /></span>
        <span class="fact-text">
          <span class="fact-lbl">When</span>
          <span class="fact-val">Wednesday 9 September 2026</span>
        </span>
      </li>
      <li class="fact">
        <span class="fact-icon"><img src="assets/icon-where.png" width="26" height="26" alt="" /></span>
        <span class="fact-text">
          <span class="fact-lbl">Where</span>
          <span class="fact-val">Elsevier office, Amsterdam Sloterdijk</span>
        </span>
      </li>
      <li class="fact">
        <span class="fact-icon"><img src="assets/icon-who.png" width="26" height="26" alt="" /></span>
        <span class="fact-text">
          <span class="fact-lbl">Who</span>
          <span class="fact-val">Senior R&amp;D digitization leaders</span>
        </span>
      </li>
    </ul>

    <div class="plate" id="plate">
      <div class="plate-empty" id="plate-empty">
        <p class="plate-empty-line">No terms yet.</p>
        <p class="plate-empty-help">Open <strong>Build</strong> to paste text, drop in a file, or type terms by hand.</p>
      </div>
      <div id="cloud"></div>

      <!-- Full screen. Lives on the plate rather than in the top bar,
           because it acts on the plate: pressing it takes the cloud alone
           to the whole screen. Both glyphs are in the DOM and CSS reveals
           the one that applies, the same idiom as the theme button. -->
      <button class="plate-fs" id="plate-fs" aria-pressed="false"
              aria-label="Show the cloud full screen" title="Full screen (F)">
        <span class="fs-icon fs-icon-open" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path d="M6.4 1.9H2.6a.7.7 0 00-.7.7v3.8M10.6 1.9h3.8a.7.7 0 01.7.7v3.8M6.4 15.1H2.6a.7.7 0 01-.7-.7v-3.8M10.6 15.1h3.8a.7.7 0 00.7-.7v-3.8"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="fs-icon fs-icon-close" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path d="M2.2 6.3H6a.7.7 0 00.7-.7V1.8M14.8 6.3H11a.7.7 0 01-.7-.7V1.8M2.2 10.7H6a.7.7 0 01.7.7v3.8M14.8 10.7H11a.7.7 0 00-.7.7v3.8"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
    </div>

    <!-- Figure caption: doubles as the legend and the source citation -->
    <figcaption class="caption">
      <ul class="legend" id="legend">
        <li><span class="key key-hi" aria-hidden="true"></span>Raised most often</li>
        <li><span class="key key-mid" aria-hidden="true"></span>Raised more than once</li>
        <li><span class="key key-lo" aria-hidden="true"></span>Raised once</li>
        <li class="legend-added" id="legend-added" hidden><span class="key key-add" aria-hidden="true"></span>Added by hand</li>
      </ul>

      <p class="cap-source" id="cap-source"></p>
      <p class="cap-source cap-privacy">
        Participant names, e-mail addresses and dietary requirements are fully excluded
        from this page and from its repository.
      </p>
      <p class="cap-source cap-design">
        Icons, colours, typography and the When / Where / Who details on this page are taken
        from the official invitation,
        <code>CS-2775_Flyer_Roundtable agenda_1_F.pdf</code> — the three icons are the flyer's
        own artwork, extracted from that file. RSVP form:
        <a href="https://forms.office.com/r/PS1rWkLcVF">https://forms.office.com/r/PS1rWkLcVF</a>
      </p>
    </figcaption>

    <p class="note note-warn fit-note" id="fit-note" hidden></p>

    <div class="plate-actions">
      <button class="btn btn-quiet" id="add-open" aria-expanded="false" aria-controls="add-panel">Add a term</button>
      <button class="btn btn-solid" id="save-png" disabled>Save PNG</button>
    </div>

    <!-- ── Add a term — discrete, collapsed ───────────────────── -->
    <section class="add-panel" id="add-panel" hidden aria-label="Add terms by hand">
      <p class="add-help">
        One term per line. Put <code>| 3</code> after a term to make it bigger.
        Start a line with <code>#</code> to leave yourself a note.
      </p>
      <textarea id="add-input" class="field field-code" spellcheck="false" rows="4"
        placeholder="Regulatory compliance | 3&#10;Lab automation&#10;Data governance | 2"></textarea>
      <div class="add-row">
        <button class="btn btn-solid btn-s" id="add-apply">Add to the cloud</button>
        <button class="btn btn-quiet btn-s" id="add-copy">Copy for the repo</button>
        <button class="linky" id="add-reset">Remove the terms I added</button>
      </div>
      <p class="note" id="add-note" hidden></p>
      <p class="add-help add-help-last">
        Terms you add here live in this browser only. To publish them for everyone,
        choose <strong>Copy for the repo</strong> and paste the result over the block in
        <code>data/manual-terms.js</code>.
      </p>
    </section>

  </figure>
</main>

<!-- ══ DRAWER — everything secondary lives here ══════════════════ -->
<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="Build a word cloud">
  <div class="drawer-head">
    <h2 class="drawer-title">Build</h2>
    <button class="icon-btn icon-btn-bare" id="drawer-close" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <path d="M4 4l7 7M11 4l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="drawer-body">

    <div class="block">
      <label class="lbl" for="preset">Where the terms come from</label>
      <select id="preset" class="field field-select"></select>
      <p class="hint" id="preset-hint"></p>
    </div>

    <div class="block">
      <label class="lbl" for="text-input">Your own text</label>
      <textarea id="text-input" class="field" rows="7" spellcheck="false"
        placeholder="Survey answers, meeting notes, anything — one term per line or separated by commas."></textarea>
    </div>

    <div class="block">
      <label class="lbl">A file instead</label>
      <div class="dropzone" id="dropzone" role="button" tabindex="0"
           aria-label="Choose a .txt or .csv file, or drag one here">
        <p class="dz-line">Drop a <strong>.txt</strong> or <strong>.csv</strong> here</p>
        <p class="dz-sub">or <span class="dz-pick">choose a file</span></p>
        <input type="file" id="file-input" accept=".txt,.csv" hidden />
      </div>
      <p class="hint hint-ok" id="file-name"></p>
      <p class="hint">Your file is read in this browser. Nothing is uploaded anywhere.</p>
    </div>

    <div class="block">
      <div class="lbl-row">
        <label class="lbl" for="stopwords">Words to ignore</label>
        <button class="linky" id="stopwords-reset">Reset</button>
      </div>
      <p class="hint">Comma-separated. Applies to the single-words view.</p>
      <textarea id="stopwords" class="field field-code" rows="4" spellcheck="false"></textarea>
    </div>

    <div class="block block-actions">
      <button class="btn btn-solid" id="generate">
        <span id="generate-label">Draw the cloud</span>
        <span class="spin" id="spin" hidden aria-hidden="true"></span>
      </button>
      <button class="btn btn-quiet" id="start-over">Start over</button>
    </div>

    <p class="note note-bad" id="problem" hidden></p>

  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.7/build/d3.layout.cloud.js"></script>
<script src="data/presets.js"></script>
<script src="data/manual-terms.js"></script>
<script src="app.js"></script>
</body>
</html>
